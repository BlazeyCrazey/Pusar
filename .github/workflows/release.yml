name: Release

# Pushing a tag such as v0.1.0, or v0.2.0-beta.1 for a beta, builds the installer,
# signs it once signing is set up, and creates a draft GitHub release with the
# files the auto-updater reads. Nothing is public until someone publishes the
# draft. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in package.json"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      - name: Build, sign and draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Microsoft Trusted Signing. Leave these unset to build without signing.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          SIGNING_PUBLISHER: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          # The update feed points at whichever repository runs this, so forks work too.
          args=(--win --publish always
            "--config.publish.provider=github"
            "--config.publish.owner=${GITHUB_REPOSITORY_OWNER}"
            "--config.publish.repo=${GITHUB_REPOSITORY#*/}"
            "--config.publish.releaseType=draft")
          if [ -n "$SIGNING_ACCOUNT" ]; then
            args+=("--config.win.azureSignOptions.endpoint=${SIGNING_ENDPOINT}"
              "--config.win.azureSignOptions.codeSigningAccountName=${SIGNING_ACCOUNT}"
              "--config.win.azureSignOptions.certificateProfileName=${SIGNING_PROFILE}"
              "--config.win.azureSignOptions.publisherName=${SIGNING_PUBLISHER}")
          else
            echo "::warning::Signing isn't set up, so this build is unsigned and SmartScreen will warn people. See docs/RELEASING.md."
          fi
          npx electron-builder "${args[@]}"
